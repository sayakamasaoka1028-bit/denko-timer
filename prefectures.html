<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>📚 都道府県別 出題履歴</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f172a;
        color: white;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      h1 {
        text-align: center;
      }

      select {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        color: black;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
      }

      th {
        background: #2563eb;
        color: white;
      }

      .back {
        display: inline-block;
        margin-top: 25px;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>📚 都道府県別 出題履歴</h1>

      <select id="prefecture" onchange="showHistory()"></select>

      <table>
        <thead>
          <tr>
            <th>試験</th>

            <th>候補問題</th>
          </tr>
        </thead>

        <tbody id="history">
          <tr>
            <td colspan="2">都道府県を選択してください</td>
          </tr>
        </tbody>
      </table>
      <a
        id="heatmapLink"
        class="back"
        href="#"
        style="display: none; margin-right: 15px"
      >
        📊 ヒートマップを見る
      </a>

      <a class="back" href="questions.html">⬅ 戻る</a>
    </div>

    <script src="prefectures.js"></script>

    <script>
      const regions = {
        "hokkaido-tohoku": [
          "北海道",
          "青森県",
          "岩手県",
          "宮城県",
          "秋田県",
          "山形県",
          "福島県",
        ],

        kanto: [
          "茨城県",
          "栃木県",
          "群馬県",
          "埼玉県",
          "千葉県",
          "東京都",
          "神奈川県",
        ],

        chubu: [
          "新潟県",
          "富山県",
          "石川県",
          "福井県",
          "山梨県",
          "長野県",
          "岐阜県",
          "静岡県",
          "愛知県",
        ],

        kinki: [
          "三重県",
          "滋賀県",
          "京都府",
          "大阪府",
          "兵庫県",
          "奈良県",
          "和歌山県",
        ],

        chugoku: ["鳥取県", "島根県", "岡山県", "広島県", "山口県"],

        shikoku: ["徳島県", "香川県", "愛媛県", "高知県"],

        kyushu: [
          "福岡県",
          "佐賀県",
          "長崎県",
          "熊本県",
          "大分県",
          "宮崎県",
          "鹿児島県",
          "沖縄県",
        ],
      };

      const params = new URLSearchParams(location.search);
      const region = params.get("region");

      const select = document.getElementById("prefecture");

      select.innerHTML = `<option value="">都道府県を選択してください</option>`;

      if (regions[region]) {
        regions[region].forEach((pref) => {
          select.innerHTML += `<option>${pref}</option>`;
        });
      }
      function showHistory() {
        const pref = document.getElementById("prefecture").value;
        const records = prefectureData[pref];

        let html = "";

        if (!records || records.length === 0) {
          html = `
      <tr>
        <td colspan="2">データ準備中</td>
      </tr>
    `;
        } else {
          records.forEach((record) => {
            html += `
        <tr>
          <td>${record[0]}</td>
          <td>${record[1]}</td>
        </tr>
      `;
          });
        }

        document.getElementById("history").innerHTML = html;

        // ← この位置に入れる
        const heatmapLink = document.getElementById("heatmapLink");

        if (pref) {
          heatmapLink.href = `heatmap.html?pref=${encodeURIComponent(pref)}`;
          heatmapLink.style.display = "inline-block";
        } else {
          heatmapLink.style.display = "none";
        }
      }
    </script>
  </body>
</html>
