<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>📚 都道府県別 出題履歴</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f172a;
        color: white;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      h1 {
        text-align: center;
      }

      select {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        color: black;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
      }

      th {
        background: #2563eb;
        color: white;
      }

      .back {
        display: inline-block;
        margin-top: 25px;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>📚 都道府県別 出題履歴</h1>

      <select id="prefecture" onchange="showHistory()">
        <option value="">都道府県を選択してください</option>
        <option>北海道</option>
        <option>青森県</option>
        <option>岩手県</option>
        <option>宮城県</option>
        <option>秋田県</option>
        <option>山形県</option>
        <option>福島県</option>
      </select>

      <table>
        <thead>
          <tr>
            <th>試験</th>

            <th>候補問題</th>
          </tr>
        </thead>

        <tbody id="history">
          <tr>
            <td colspan="2">都道府県を選択してください</td>
          </tr>
        </tbody>
      </table>

      <a class="back" href="questions.html"> ⬅ ホームへ戻る </a>
    </div>

    <script src="prefectures.js"></script>

    <script>
      function showHistory() {
        const pref = document.getElementById("prefecture").value;
        const records = prefectureData[pref];

        let html = "";

        if (!records || records.length === 0) {
          html = `
        <tr>
            <td colspan="2">データ準備中</td>
        </tr>
        `;
        } else {
          records.forEach((record) => {
            html += `
            <tr>
                <td>${record[0]}</td>
                <td>${record[1]}</td>
            </tr>
            `;
          });
        }

        document.getElementById("history").innerHTML = html;
      }
    </script>
  </body>
</html>
