<!doctype html>
<html lang="ja">
  <head>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .card {
        width: 700px;
        background: #1e293b;
        padding: 30px;
        border-radius: 20px;
      }

      h1 {
        text-align: center;
      }

      a {
        display: block;
        padding: 15px;
        margin: 10px 0;
        text-decoration: none;
        color: white;
        background: #334155;
        border-radius: 12px;
        transition: 0.2s;
      }

      a:hover {
        background: #475569;
      }

      .back {
        margin-top: 30px;
        background: #2563eb;
      }

  <body>
