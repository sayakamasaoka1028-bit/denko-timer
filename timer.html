<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>⚡第二種電気工事士 実技タイマー</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.card{
    width:500px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:30px;
    padding:40px;
    text-align:center;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h1{
    margin-top:0;
}

#timer{
    font-size:90px;
    font-weight:bold;
    margin:20px 0;
}

.red{
    color:#ff4d4d;
}

button{
    border:none;
    border-radius:20px;
    padding:15px 35px;
    font-size:22px;
    cursor:pointer;
    margin:10px;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

.start{
    background:#22c55e;
    color:white;
}

.reset{
    background:#64748b;
    color:white;
}

.info{
    margin-top:25px;
    font-size:20px;
    opacity:.9;
}
</style>
</head>

<body>

<div class="card">

<h1>⚡ 第二種電気工事士</h1>
<h2>実技タイマー</h2>

<div style="margin-bottom:20px;">
候補問題 No.

<input
id="questionNo"
type="number"
min="1"
max="13"
value="1"
style="
width:80px;
font-size:22px;
text-align:center;
border-radius:10px;
padding:5px;
border:none;
">
</div>

<div id="timer">40:00</div>


<button class="start" onclick="startTimer()">
▶ 開始
</button>

<button class="reset" onclick="pauseTimer()">
⏸ 一時停止
</button>

<button class="reset" onclick="resetTimer()">
↺ リセット
</button>

<button class="start" onclick="finishTimer()">
🏁 完成
</button>

<button class="reset" onclick="deleteLastRecord()">
🗑 最新削除
</button>

<div class="info">
目標：30分以内完成🔥
</div>

<hr>

<h3>🏆 BEST</h3>
<div id="best">--:--</div>

<h3>📊 AVG</h3>
<div id="avg">--:--</div>

<h3>🔥 練習回数</h3>
<div id="count">0</div>

<hr>

<h3>履歴</h3>
<div id="history"></div>

</div>

<script>

const TOTAL = 40 * 60;

let seconds = TOTAL;
let started = false;
let interval = null;

function updateDisplay(){

    let m = Math.floor(seconds / 60);
    let s = seconds % 60;

    const timer = document.getElementById("timer");

    timer.textContent =
        String(m).padStart(2,"0")
        + ":"
        + String(s).padStart(2,"0");

    if(seconds <= 300){
        timer.classList.add("red");
    }
}

function startTimer(){

    if(started) return;

    started = true;

    interval = setInterval(()=>{

        seconds--;

        updateDisplay();

        if(seconds === 1200){
            alert("⚠️ 半分経過しました");
        }

        if(seconds === 300){
            alert("🚨 残り5分！");
        }

        if(seconds <= 0){
            clearInterval(interval);
            alert("🏁 試験終了！");
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);

    started = false;
}

function resetTimer(){

    clearInterval(interval);

    started = false;
    seconds = TOTAL;

    const timer = document.getElementById("timer");

    timer.classList.remove("red");

    updateDisplay();
}

function deleteLastRecord(){

    let records =
        JSON.parse(
            localStorage.getItem("denkoRecords")
        ) || [];

    if(records.length === 0){

        alert("削除する履歴がありません");

        return;
    }

    records.pop();

    localStorage.setItem(
        "denkoRecords",
        JSON.stringify(records)
    );

    loadRecords();

    alert("最新の履歴を削除しました");
}

function finishTimer(){

clearInterval(interval);

started = false;

    let used = TOTAL - seconds;

    let m = Math.floor(used / 60);
    let s = used % 60;

    let no =
        document.getElementById("questionNo").value;

    let record = {
        date: new Date().toLocaleString(),
        no: no,
        seconds: used
    };

    let records =
        JSON.parse(
            localStorage.getItem("denkoRecords")
        ) || [];

let isBest = false;

if(records.length === 0){
    isBest = true;
}else{

    let currentBest =
        Math.min(...records.map(r => r.seconds));

    if(used < currentBest){
        isBest = true;
    }
}    

records.push(record);

    localStorage.setItem(
        "denkoRecords",
        JSON.stringify(records)
    );

    loadRecords();


let message =
    "保存しました\nNo." +
    no +
    "\nタイム " +
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0");

if(isBest){

    message =
        "🏆 自己ベスト更新！\n\n" +
        message;
}

alert(message);
}

function loadRecords(){

    let records =
        JSON.parse(
            localStorage.getItem("denkoRecords")
        ) || [];

    document.getElementById("count")
        .textContent = records.length;

if(records.length === 0){

    document.getElementById("best")
        .textContent = "--:--";

    document.getElementById("avg")
        .textContent = "--:--";

    document.getElementById("history")
        .innerHTML = "";

    return;
}


    let best =
        Math.min(...records.map(r => r.seconds));

    let avg =
        Math.floor(
            records.reduce(
                (a,b)=>a+b.seconds,0
            ) / records.length
        );

    document.getElementById("best")
        .textContent =
        formatTime(best);

    document.getElementById("avg")
        .textContent =
        formatTime(avg);

    let html = "";

    records.slice().reverse().forEach(r=>{

        html += `
        <div style="margin-bottom:10px;">
        ${r.date}<br>
        No.${r.no}<br>
        ${formatTime(r.seconds)}
        </div>
        `;
    });

    document.getElementById("history")
        .innerHTML = html;
}

function formatTime(sec){

    let m = Math.floor(sec/60);
    let s = sec%60;

    return String(m).padStart(2,"0")
        + ":"
        + String(s).padStart(2,"0");
}


loadRecords();
updateDisplay();

</script>

</body>
</html>
