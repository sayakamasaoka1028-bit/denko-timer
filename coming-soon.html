<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>🚧 データ確認中</title>

    <style>
      body {
        margin: 0;
        background: #0f172a;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        width: 600px;
        background: #1e293b;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      h1 {
        margin-top: 0;
      }

      p {
        line-height: 1.8;
        font-size: 18px;
      }

      a {
        display: inline-block;
        margin-top: 25px;
        padding: 14px 28px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        transition: 0.2s;
      }

      a:hover {
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🚧 データ確認中</h1>

      <p>
        現在、この地域の出題履歴データを確認中です。<br />
        確認が取れ次第、順次追加予定です。
      </p>

      <a href="javascript:history.back()"> ⬅ 前のページへ戻る </a>
    </div>
  </body>
</html>
